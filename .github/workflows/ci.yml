name: Go CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: experiments/provider-abstraction/chatgptweb-sidecar/pyproject.toml

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o /tmp/runstead ./cmd/runstead

      - name: Run protocol checks
        run: bash experiments/protocol/test.sh

      - name: Test provider-abstraction Go module
        working-directory: experiments/provider-abstraction
        run: go test ./...

      - name: Vet provider-abstraction Go module
        working-directory: experiments/provider-abstraction
        run: go vet ./...

      - name: Build provider-abstraction Go module
        working-directory: experiments/provider-abstraction
        run: go build ./...

      - name: Install sidecar development dependencies
        working-directory: experiments/provider-abstraction/chatgptweb-sidecar
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run sidecar deterministic tests
        working-directory: experiments/provider-abstraction/chatgptweb-sidecar
        run: python -m pytest tests/ -q

      - name: Run sidecar lint and compile checks
        working-directory: experiments/provider-abstraction/chatgptweb-sidecar
        run: ruff check chatgptweb tests && python -m compileall -q chatgptweb tests

      - name: Reject removed cookie-encryption residue
        run: '! grep -RInE --exclude-dir=.git --exclude-dir=__pycache__ --exclude=''*.pyc'' "CHATGPTWEB_MASTER_KEY|cookies\\.enc|encrypt_cookies|decrypt_cookies|from chatgptweb.crypto" experiments/provider-abstraction/chatgptweb-sidecar/chatgptweb experiments/provider-abstraction/chatgptweb-sidecar/tests experiments/provider-abstraction/chatgptweb-sidecar/pyproject.toml'

      - name: Run standalone browser-substrate spike deterministic checks
        # Zero model turns, zero browser launch. Validates the review-hardened
        # standalone spike: exact-origin contract, conservative conversation-
        # namespace classifier, URL/target/conv-id redaction shaping, the
        # deterministic timeout fail-closed state machine, the canonical
        # live-evidence rebuild idempotence + cross-artifact agreement, and a
        # leak scan over the derived evidence artifacts.
        run: bash experiments/first-party-chatgpt-web-standalone/test.sh

      - name: Protocol golden corpus gate (runstead.protocol.v1)
        # Proves the action/final envelopes stay parser-compatible: every
        # corpus fixture must keep its expected classification, and drift
        # (missing/extra cases or changed expectations) fails the build.
        run: go test -count=1 ./internal/protocol/ -run '^(TestCorpusFixtures|TestParseValidAction|TestParseValidFinal|TestEnvelopeMarkersInsideJSONStringsAreContent)$'

      - name: Build quality gates
        working-directory: tools/quality
        run: go build -o /tmp/quality-gates .

      - name: Quality gate self-tests and vet
        working-directory: tools/quality
        run: go test -count=1 ./... && go vet ./...

      - name: "Quality gate: bounded growth"
        run: /tmp/quality-gates growth --root "$GITHUB_WORKSPACE"

      - name: "Quality gate: swallowed errors"
        run: /tmp/quality-gates errcheck --root "$GITHUB_WORKSPACE"

      - name: "Quality gate: live-test convention"
        run: /tmp/quality-gates live-convention --root "$GITHUB_WORKSPACE"
