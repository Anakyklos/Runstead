name: Go CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o /tmp/runstead ./cmd/runstead

      - name: Run protocol checks
        run: bash experiments/protocol/test.sh

      - name: Protocol golden corpus gate (runstead.protocol.v1)
        # Proves the action/final envelopes stay parser-compatible: every
        # corpus fixture must keep its expected classification, and drift
        # (missing/extra cases or changed expectations) fails the build.
        run: go test -count=1 ./internal/protocol/ -run '^(TestCorpusFixtures|TestParseValidAction|TestParseValidFinal|TestEnvelopeMarkersInsideJSONStringsAreContent)$'

      - name: Build quality gates
        working-directory: tools/quality
        run: go build -o /tmp/quality-gates .

      - name: Quality gate self-tests and vet
        working-directory: tools/quality
        run: go test -count=1 ./... && go vet ./...

      - name: "Quality gate: bounded growth"
        run: /tmp/quality-gates growth --root "$GITHUB_WORKSPACE"

      - name: "Quality gate: swallowed errors"
        run: /tmp/quality-gates errcheck --root "$GITHUB_WORKSPACE"

      - name: "Quality gate: live-test convention"
        run: /tmp/quality-gates live-convention --root "$GITHUB_WORKSPACE"
