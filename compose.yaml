services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        RUNSTEAD_UID: "${RUNSTEAD_UID:-1000}"
        RUNSTEAD_GID: "${RUNSTEAD_GID:-1000}"
    working_dir: /workspace
    command: ["bash"]
    stdin_open: true
    tty: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - HOME=/home/runstead
      - GOMODCACHE=/go/pkg/mod
      - GOCACHE=/home/runstead/.cache/go-build
      - RUNSTEAD_STATE_DIR=/home/runstead/.local/share/runstead
      - OMNIROUTE_BASE_URL
      - OMNIROUTE_API_KEY
      - OMNIROUTE_MODEL
      - OMNIROUTE_CHAT_ENDPOINT
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: go-mod-cache
        target: /go/pkg/mod
      - type: volume
        source: go-build-cache
        target: /home/runstead/.cache/go-build
      - type: volume
        source: runstead-state
        target: /home/runstead/.local/share/runstead

volumes:
  go-mod-cache:
  go-build-cache:
  runstead-state:
